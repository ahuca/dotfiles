[defaults]
inventory            = inventory.ini
roles_path           = roles
become_plugins       = plugins/become
interpreter_python   = auto_silent
display_skipped_hosts = false
retry_files_enabled  = false
nocows               = 1

# Deprecated; removed in ansible-core 2.24.
inject_facts_as_vars = false

# Not `stdout_callback = yaml`: removed in community.general 12.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml

[privilege_escalation]
become        = false
# Revert to `sudo` once ansible-core ships the sudo-rs prompt fix.
become_method = sudo_rs
