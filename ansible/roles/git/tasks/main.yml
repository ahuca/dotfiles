---
# Signs with the public key only: ssh-keygen finds the private half in the
# Bitwarden SSH agent, so the vault must be unlocked to commit. Which key is
# picked at commit time from user.email (files/signing-key), so no key is
# stored in git's config.
# Emails, hosts and keys come from the environment or this machine, never the repo.
- name: Read git's user.email
  ansible.builtin.command: git config --global user.email
  register: _git_user_email
  changed_when: false
  failed_when: false
  check_mode: false
  when: git_signing_email | length == 0

# The keys a previous run found, as "<email> <type> <key>" lines, for when the
# agent is locked.
- name: Read the allowed signers written by a previous run
  ansible.builtin.set_fact:
    _known_signers: >-
      {{ (query('ansible.builtin.file', git_allowed_signers_file, errors='ignore')
          | first | default('')).splitlines() | reject('match', '#') | list }}

# Every key lives in Bitwarden; nothing is read from ~/.ssh.
- name: List the keys in the Bitwarden SSH agent
  ansible.builtin.command: ssh-add -L
  environment:
    SSH_AUTH_SOCK: "{{ bitwarden_ssh_agent_sock | replace('$HOME', target_home) }}"
  register: _agent_keys
  changed_when: false
  failed_when: false
  check_mode: false

# The agent key whose comment is the email, without the comment.
- name: Resolve the signing identity
  ansible.builtin.set_fact:
    _signing_email: "{{ _email }}"
    _signing_key: >-
      {{ ((_agent_keys.stdout_lines | default([])
           | select('match', '.* ' ~ (_email | regex_escape) ~ '$')
           | first | default('')).split(' ')[:2] | join(' '))
         or (_known_signers | select('match', (_email | regex_escape) ~ ' ')
             | map('regex_replace', '^[^ ]+ ', '') | first | default('')) }}
  vars:
    _email: "{{ git_signing_email if git_signing_email | length > 0 else (_git_user_email.stdout | default('')) }}"
  when: git_signing_enabled | bool

- name: Configure per-remote identities
  ansible.builtin.import_tasks: profiles.yml
  when: git_profiles_enabled | bool

# Every identity git may commit as: the global one and each profile's.
- name: Collect the signing identities
  ansible.builtin.set_fact:
    _signers: >-
      {{ _ids | map(attribute='email') | zip(_ids | map(attribute='key'))
         | map('join', ' ') | unique | list }}
  vars:
    _ids: >-
      {{ ([{'email': _signing_email, 'key': _signing_key}] + (_git_active | default([])))
         | selectattr('email') | selectattr('key') | list }}
  when: git_signing_enabled | bool

- name: Note that commit signing is being skipped
  ansible.builtin.debug:
    msg: >-
      Skipping commit signing: no signing key found. Set git's user.email and
      unlock Bitwarden with a matching SSH key (its comment must be that
      email), or set GIT_SIGNING_EMAIL / GIT_SIGNING_KEY.
  when:
    - git_signing_enabled | bool
    - _signers | length == 0

- name: Configure SSH commit signing
  when:
    - git_signing_enabled | bool
    - _signers | length > 0
  block:
    - name: Ensure the git config directory exists
      ansible.builtin.file:
        path: "{{ git_config_dir }}"
        state: directory
        mode: "0755"

    # Lets `git log --show-signature` / `git verify-commit` check SSH signatures.
    - name: Write the allowed signers file
      ansible.builtin.template:
        src: allowed_signers.j2
        dest: "{{ git_allowed_signers_file }}"
        mode: "0644"

    - name: Sign commits and tags with SSH keys
      community.general.git_config:
        scope: global
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: gpg.format, value: ssh }
        - { name: gpg.ssh.allowedSignersFile, value: "{{ git_allowed_signers_file }}" }
        - { name: commit.gpgsign, value: "true" }
        - { name: tag.gpgsign, value: "true" }
        - { name: gpg.ssh.defaultKeyCommand, value: "{{ git_signing_key_command }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Install the signing key lookup
      ansible.builtin.copy:
        src: signing-key
        dest: "{{ git_signing_key_command }}"
        mode: "0755"

    # Set, it would win over the lookup for every repo, profiles included.
    - name: Drop the stored signing key
      community.general.git_config:
        scope: global
        name: user.signingkey
        state: absent

- name: Configure delta
  ansible.builtin.import_tasks: delta.yml
  when: git_delta_enabled | bool
  tags: [delta]
