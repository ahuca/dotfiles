---
# CopyQ's own global shortcut cannot grab keys under Wayland.
- name: Bind the CopyQ hotkey through GNOME custom shortcuts
  when:
    - copyq_hotkey_enabled | bool
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is defined
  tags: [copyq, gnome]
  vars:
    _ck_root: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    _ck_path: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/copyq/
  block:
    - name: Read the existing custom-keybinding list
      community.general.dconf:
        key: "{{ _ck_root }}"
        state: read
      register: _ck_list

    - name: Register our binding in the list, preserving any others
      community.general.dconf:
        key: "{{ _ck_root }}"
        value: "{{ (_ck_existing + [_ck_path]) | unique | to_json }}"
        state: present
      vars:
        _ck_existing: "{{ _ck_list.value | default('', true) | regex_findall(\"'([^']+)'\") }}"
      when: _ck_path not in _ck_existing

    - name: Configure the binding
      community.general.dconf:
        key: "{{ _ck_path }}{{ item.key }}"
        value: "'{{ item.value }}'"
        state: present
      loop:
        - { key: name, value: "{{ copyq_hotkey_name }}" }
        - { key: command, value: "{{ copyq_hotkey_command }}" }
        - { key: binding, value: "{{ copyq_hotkey_binding }}" }
      loop_control:
        label: "{{ item.key }}"

- name: Note the skipped hotkey binding
  ansible.builtin.debug:
    msg: No D-Bus session bus — re-run from your desktop session with --tags copyq
  when:
    - copyq_hotkey_enabled | bool
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is not defined
  tags: [copyq, gnome]

- name: Ensure the autostart directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.config/autostart"
    state: directory
    mode: "0755"
  when: copyq_autostart | bool
  tags: [copyq]

- name: Autostart CopyQ
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/autostart/copyq.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=CopyQ
      Exec=copyq
      Icon=copyq
      X-GNOME-Autostart-enabled=true
      Comment=Clipboard manager
  when: copyq_autostart | bool
  tags: [copyq]

- name: Bind the "Always on top" toggle
  when:
    - wm_toggle_above_bindings | length > 0
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is defined
  tags: [keybindings, gnome]
  block:
    - name: Read the effective "Always on top" bindings
      ansible.builtin.command: gsettings get org.gnome.desktop.wm.keybindings toggle-above
      register: _toggle_above
      changed_when: false

    - name: Add our bindings, preserving any others
      community.general.dconf:
        key: /org/gnome/desktop/wm/keybindings/toggle-above
        value: "{{ (_existing + wm_toggle_above_bindings) | unique | to_json }}"
        state: present
      vars:
        _existing: "{{ _toggle_above.stdout | regex_findall(\"'([^']+)'\") }}"
      when: wm_toggle_above_bindings | difference(_existing) | length > 0

- name: Note the skipped "Always on top" bindings
  ansible.builtin.debug:
    msg: No D-Bus session bus — re-run from your desktop session with --tags keybindings
  when:
    - wm_toggle_above_bindings | length > 0
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is not defined
  tags: [keybindings, gnome]

- name: Deploy the custom XKB option
  ansible.builtin.copy:
    src: xkb/
    dest: "{{ target_home }}/.config/xkb/"
    mode: "0644"
    directory_mode: "0755"
  when: xkb_lsgt_on_tlde | bool
  tags: [keyboard, gnome]

- name: Enable the custom XKB option in GNOME
  when:
    - xkb_lsgt_on_tlde | bool
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is defined
  tags: [keyboard, gnome]
  vars:
    _xkb_key: /org/gnome/desktop/input-sources/xkb-options
    _xkb_option: custom:lsgt_on_tlde
  block:
    - name: Read the existing XKB options
      community.general.dconf:
        key: "{{ _xkb_key }}"
        state: read
      register: _xkb_opts

    - name: Add our option, preserving any others
      community.general.dconf:
        key: "{{ _xkb_key }}"
        value: "{{ (_xkb_existing + [_xkb_option]) | unique | to_json }}"
        state: present
      vars:
        _xkb_existing: "{{ _xkb_opts.value | default('', true) | regex_findall(\"'([^']+)'\") }}"
      when: _xkb_option not in _xkb_existing

- name: Note the skipped XKB option
  ansible.builtin.debug:
    msg: No D-Bus session bus — re-run from your desktop session with --tags keyboard
  when:
    - xkb_lsgt_on_tlde | bool
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is not defined
  tags: [keyboard, gnome]

# GNOME on Wayland only loads a new extension at login, so this installs and
# enables it for the next one. GNOME updates it from then on.
- name: Install the GNOME Shell extensions
  when:
    - gnome_extensions | length > 0 or gnome_extensions_disabled | length > 0
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is defined
  tags: [extensions, gnome]
  vars:
    _ext_dir: "{{ target_home }}/.local/share/gnome-shell/extensions"
  block:
    - name: Read the GNOME Shell version
      ansible.builtin.command: gnome-shell --version
      register: _gnome_shell_version
      changed_when: false
      check_mode: false

    - name: Look for the installed extensions
      ansible.builtin.stat:
        path: "{{ _ext_dir }}/{{ item }}"
      loop: "{{ gnome_extensions }}"
      register: _ext_stat

    - name: Download the missing extensions
      ansible.builtin.get_url:
        url: "https://extensions.gnome.org/download-extension/{{ item.item }}.shell-extension.zip?shell_version={{ _shell_major }}"
        dest: "/tmp/{{ item.item }}.zip"
        mode: "0644"
      vars:
        _shell_major: "{{ _gnome_shell_version.stdout | regex_search('[0-9]+') }}"
      loop: "{{ _ext_stat.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Install the missing extensions
      ansible.builtin.command: gnome-extensions install --force /tmp/{{ item.item }}.zip
      changed_when: true
      loop: "{{ _ext_stat.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the enabled and disabled extension lists
      community.general.dconf:
        key: "/org/gnome/shell/{{ item }}"
        state: read
      loop: [enabled-extensions, disabled-extensions]
      register: _ext_lists

    - name: Enable ours and disable the conflicting ones, preserving the rest
      community.general.dconf:
        key: "/org/gnome/shell/{{ item.key }}"
        value: "{{ item.value | to_json }}"
        state: present
      vars:
        _enabled: "{{ _ext_lists.results[0].value | default('', true) | regex_findall(\"'([^']+)'\") }}"
        _disabled: "{{ _ext_lists.results[1].value | default('', true) | regex_findall(\"'([^']+)'\") }}"
      loop:
        - key: enabled-extensions
          value: "{{ (_enabled + gnome_extensions) | unique | difference(gnome_extensions_disabled) }}"
          current: "{{ _enabled }}"
        - key: disabled-extensions
          value: "{{ (_disabled + gnome_extensions_disabled) | unique | difference(gnome_extensions) }}"
          current: "{{ _disabled }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value | sort != item.current | sort

- name: Note the skipped GNOME Shell extensions
  ansible.builtin.debug:
    msg: No D-Bus session bus — re-run from your desktop session with --tags extensions
  when:
    - gnome_extensions | length > 0 or gnome_extensions_disabled | length > 0
    - ansible_facts.env.DBUS_SESSION_BUS_ADDRESS is not defined
  tags: [extensions, gnome]
