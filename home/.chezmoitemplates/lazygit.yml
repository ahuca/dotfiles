{{- if lookPath "delta" -}}
# Managed by chezmoi (home/.chezmoitemplates/lazygit.yml).
# Diffs through delta; clickable line numbers open the file in your editor.
git:
  pagers:
    - pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
{{ end -}}
