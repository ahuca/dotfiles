---
- name: Install Ubuntu's packages
  ansible.builtin.import_tasks: ubuntu.yml
  when: platform == 'ubuntu'

- name: Install Bazzite's packages
  ansible.builtin.import_tasks: bazzite.yml
  when: platform == 'bazzite'

# User-local (~/.local/bin, no sudo); ~/.zshrc already puts that on PATH.
# --no-modify-path keeps the installer from duplicating that line elsewhere.
- name: Install uv
  when: uv_enabled | bool
  tags: [uv]
  block:
    - name: Fetch the uv install script
      ansible.builtin.get_url:
        url: https://astral.sh/uv/install.sh
        dest: /tmp/uv-install.sh
        mode: "0755"
      changed_when: false
      check_mode: false

    - name: Run the uv installer
      ansible.builtin.command:
        cmd: /tmp/uv-install.sh --no-modify-path
        creates: "{{ target_home }}/.local/bin/uv"
