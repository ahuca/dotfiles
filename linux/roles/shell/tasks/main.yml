---
# ~/.zshrc itself comes from chezmoi (home/dot_zshrc.tmpl), so the installer
# leaves it alone.
- name: Install oh-my-zsh
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    creates: "{{ target_home }}/.oh-my-zsh"
  environment:
    RUNZSH: "no"
    CHSH: "no"
    KEEP_ZSHRC: "yes"
  when: oh_my_zsh_enabled | bool
  tags: [zsh]

- name: Clone the oh-my-zsh plugins it doesn't bundle
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ target_home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: "{{ package_state == 'latest' }}"
  loop: "{{ oh_my_zsh_custom_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  when: oh_my_zsh_enabled | bool
  tags: [zsh, zsh_plugins]

# Only a zsh from the OS: a login shell from Homebrew would lock you out of
# the desktop if brew ever broke. On Bazzite that is the layered one, absent
# if rpm-ostree failed or the image was rolled back past it.
- name: Locate the zsh binary
  ansible.builtin.stat:
    path: /usr/bin/zsh
  register: _zsh_bin
  when: zsh_set_default_shell | bool
  tags: [zsh]

- name: Make zsh the login shell
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /usr/bin/zsh
  become: true
  when:
    - zsh_set_default_shell | bool
    - _zsh_bin.stat.exists
  tags: [zsh]

- name: Note the unchanged login shell
  ansible.builtin.debug:
    msg: "/usr/bin/zsh is missing, so the login shell stays as it is. Install zsh and re-run with --tags zsh."
  when:
    - zsh_set_default_shell | bool
    - not _zsh_bin.stat.exists
  tags: [zsh]
