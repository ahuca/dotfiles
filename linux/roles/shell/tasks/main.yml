---
# ~/.zshrc itself comes from chezmoi (home/dot_zshrc.tmpl), so the installer
# leaves it alone.
- name: Install oh-my-zsh
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    creates: "{{ target_home }}/.oh-my-zsh"
  environment:
    RUNZSH: "no"
    CHSH: "no"
    KEEP_ZSHRC: "yes"
  when: oh_my_zsh_enabled | bool
  tags: [zsh]

- name: Clone the oh-my-zsh plugins it doesn't bundle
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ target_home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: "{{ package_state == 'latest' }}"
  loop: "{{ oh_my_zsh_custom_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  when: oh_my_zsh_enabled | bool
  tags: [zsh, zsh_plugins]

- name: Locate the zsh binary
  ansible.builtin.command: which zsh
  register: _zsh_path
  changed_when: false
  check_mode: false
  when: zsh_set_default_shell | bool
  tags: [zsh]

- name: Make zsh the login shell
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: "{{ _zsh_path.stdout }}"
  become: true
  when: zsh_set_default_shell | bool
  tags: [zsh]
