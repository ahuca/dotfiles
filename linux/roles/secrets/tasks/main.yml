---
# Ansible never touches a secret value; sync-secrets fetches them at runtime.
# Vault URL/login come from the environment (bootstrap.sh), never the repo.
# Unset (e.g. an unattended first boot) => skip with a pointer, don't fail.
- name: Note that the secrets role is being skipped
  ansible.builtin.debug:
    msg: >-
      Skipping secrets: RBW_BASE_URL / RBW_EMAIL are not set. Run
      ./bootstrap.sh from a terminal and it will ask for them once.
  when:
    - rbw_enabled | bool
    - (rbw_base_url | length == 0) or (rbw_email | length == 0)
  tags: [secrets, rbw]

- name: Set up rbw and materialise the API keys
  when:
    - rbw_enabled | bool
    - rbw_base_url | length > 0
    - rbw_email | length > 0
  tags: [secrets, rbw]
  block:
    - name: Install rbw and its pinentry
      ansible.builtin.apt:
        name:
          - rbw
          - "{{ rbw_pinentry }}"
        state: "{{ package_state }}"
      become: true

    - name: Ensure the rbw config directory exists
      ansible.builtin.file:
        path: "{{ target_home }}/.config/rbw"
        state: directory
        mode: "0700"

    - name: Write the rbw configuration
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ target_home }}/.config/rbw/config.json"
        mode: "0600"
        backup: true

    # rbw creates these with the default umask (group/world-listable). The
    # cache holds the encrypted vault plus a 30-day refresh token.
    - name: Restrict rbw's cache and data directories to the owner
      ansible.builtin.file:
        path: "{{ target_home }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [.cache/rbw, .local/share/rbw]

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ target_home }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Deploy the sync-secrets script
      ansible.builtin.template:
        src: sync-secrets.j2
        dest: "{{ target_home }}/.local/bin/sync-secrets"
        mode: "0700"

    - name: Render opencode's config with {file:} references instead of keys
      ansible.builtin.template:
        src: opencode.jsonc.j2
        dest: "{{ target_home }}/.config/opencode/opencode.jsonc"
        mode: "0644"
        backup: true
      when: opencode_secrets | length > 0

    - name: Install the login-time refresh unit
      when: rbw_sync_on_login | bool
      block:
        - name: Ensure the systemd user unit directory exists
          ansible.builtin.file:
            path: "{{ target_home }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Deploy the sync-secrets user unit
          ansible.builtin.template:
            src: sync-secrets.service.j2
            dest: "{{ target_home }}/.config/systemd/user/sync-secrets.service"
            mode: "0644"

        - name: Enable it for the graphical session
          ansible.builtin.systemd_service:
            name: sync-secrets.service
            scope: user
            enabled: true
            daemon_reload: true
