---
# git errors out on every paged command if core.pager is missing, so nothing
# is set until the packages role has installed delta.
- name: Look for delta
  ansible.builtin.command: sh -c 'command -v delta'
  register: _delta_bin
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note that the delta setup is being skipped
  ansible.builtin.debug:
    msg: delta is not installed — run with --tags packages first, then --tags delta
  when: _delta_bin.rc != 0

- name: Use delta for diffs
  when: _delta_bin.rc == 0
  block:
    - name: Make delta git's pager
      community.general.git_config:
        scope: global
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: core.pager, value: delta }
        - { name: interactive.diffFilter, value: delta --color-only }
        # n / N jump between files.
        - { name: delta.navigate, value: "true" }
        # Conflict markers also show the common ancestor.
        - { name: merge.conflictStyle, value: zdiff3 }
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure the lazygit config directory exists
      ansible.builtin.file:
        path: "{{ target_home }}/.config/lazygit"
        state: directory
        mode: "0755"

    - name: Deploy the lazygit config
      ansible.builtin.copy:
        src: lazygit.yml
        dest: "{{ target_home }}/.config/lazygit/config.yml"
        mode: "0644"
        backup: true
