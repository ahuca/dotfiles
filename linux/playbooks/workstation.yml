---
- ansible.builtin.import_playbook: platform.yml

- name: Provision this workstation
  hosts: workstation
  gather_facts: true

  roles:
    - role: common
      tags: [always]
    - role: apt_repos
      tags: [repos]
      when: platform == 'ubuntu'
    - role: packages
      tags: [packages]
    - role: docker
      tags: [docker]
      when: platform == 'ubuntu'
    # GNOME only; Bazzite runs KDE Plasma.
    - role: desktop
      tags: [desktop]
      when: platform == 'ubuntu'
    # Hardware of one Ubuntu laptop; skips itself elsewhere anyway.
    - role: touchpad
      tags: [touchpad]
      when: platform == 'ubuntu'
    - role: shell
      tags: [shell]
    - role: homebrew
      tags: [brew]
    # Installs fnm and pnpm with brew.
    - role: nodejs
      tags: [node]

  post_tasks:
    - name: Wrap up
      ansible.builtin.debug:
        msg:
          - "Done. Dotfiles (git, ssh, zsh, secrets) come next from chezmoi: bootstrap.sh runs it, or `chezmoi apply`."
          - "Log out and back in for zsh to take effect."
          - "Bitwarden: Settings -> tick 'Enable SSH agent', unlock the vault, add SSH-key items."
