---
- name: Provision this workstation
  hosts: workstation
  gather_facts: true

  roles:
    - role: common
      tags: [always]
    - role: apt_repos
      tags: [repos]
    - role: packages
      tags: [packages]
    - role: docker
      tags: [docker]
    - role: desktop
      tags: [desktop]
    - role: touchpad
      tags: [touchpad]
    - role: shell
      tags: [shell]
    - role: nodejs
      tags: [node]
    - role: homebrew
      tags: [brew]

  post_tasks:
    - name: Wrap up
      ansible.builtin.debug:
        msg:
          - "Done. Dotfiles (git, ssh, zsh, secrets) come next from chezmoi: bootstrap.sh runs it, or `chezmoi apply`."
          - "Log out and back in for zsh to take effect."
          - "Bitwarden: Settings -> tick 'Enable SSH agent', unlock the vault, add SSH-key items."
