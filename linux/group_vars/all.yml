---
target_user: "{{ lookup('env', 'USER') }}"
target_home: "{{ lookup('env', 'HOME') }}"

# present | latest
package_state: present

# ── apt repositories ────────────────────────────────────────────────
# managed_by_package: the package writes its own .sources on upgrade, so ours
# is only used for the first install and skipped once it is present.
apt_keyring_dir: /etc/apt/keyrings

apt_repositories:
  - name: charm
    key_url: https://repo.charm.sh/apt/gpg.key
    keyring: charm.asc
    uris: https://repo.charm.sh/apt/
    suites: "*"
    components: "*"

  - name: vscode
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    keyring: microsoft.asc
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: [amd64, arm64, armhf]
    managed_by_package: code

  - name: github-cli
    key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    keyring: githubcli-archive-keyring.gpg
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: ["{{ deb_architecture }}"]

  - name: claude-code
    key_url: https://downloads.claude.ai/keys/claude-code.asc
    # fingerprint 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
    keyring: claude-code.asc
    uris: "https://downloads.claude.ai/claude-code/apt/{{ claude_code_channel }}"
    suites: "{{ claude_code_channel }}"
    components: main

  - name: microsoft-edge
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    keyring: microsoft.asc
    uris: https://packages.microsoft.com/repos/edge
    suites: stable
    components: main
    architectures: [amd64]
    managed_by_package: microsoft-edge-stable

  # For Intune Portal. Signed with the 2025 key, not microsoft.asc.
  - name: microsoft-prod
    key_url: https://packages.microsoft.com/keys/microsoft-2025.asc
    keyring: microsoft-2025.asc
    uris: "https://packages.microsoft.com/ubuntu/{{ ansible_facts.distribution_version }}/prod"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    architectures: [amd64]

  # ONLYOFFICE Desktop Editors. "squeeze" is the suite for every release.
  # Also carries its own ttf-mscorefonts-installer, which (unlike Ubuntu's)
  # asks no EULA question, so the install runs unattended.
  - name: onlyoffice
    key_url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
    # fingerprint E09CA29F6E178040EF22B4098320CA65CB2DE8E5
    keyring: onlyoffice.asc
    uris: https://download.onlyoffice.com/repo/debian
    suites: squeeze
    components: main

# Docker's repo is registered by the docker role.

# One-line .list files from older manual setups; they duplicate the above.
legacy_apt_lists:
  - charm.list
  - vscode.list
  - github-cli.list
  - claude-code.list
  - microsoft-edge-stable.list
  - microsoft-prod.list
  - onlyoffice.list

# stable | latest
claude_code_channel: latest

# ── packages ────────────────────────────────────────────────────────
apt_packages:
  - neovim
  - 7zip
  - keepassxc
  - copyq
  - wl-clipboard
  - kdeconnect
  - ghostty
  - zsh
  - fzf
  - glow
  - lazygit
  - git-delta
  - tealdeer # the tldr command
  - code
  - gh
  - microsoft-edge-stable
  - intune-portal
  - onlyoffice-desktopeditors

# Upgraded on every run, regardless of package_state.
apt_packages_latest:
  - claude-code

snap_packages:
  - name: bitwarden
  # The prod apt repo only carries powershell-preview.
  - name: powershell
    classic: true

d2_enabled: true
d2_bin: /usr/local/bin/d2

# Not packaged for Ubuntu: the .deb from the latest GitHub release.
topgrade_enabled: true
topgrade_repo: topgrade-rs/topgrade

# Fallback if this stops resolving: https://ui.com/download/app/identity-desktop
unifi_identity_enabled: true
unifi_identity_url: "https://fw-update.ui.com/api/v2/firmware-latest/data?filter=eq~~product~~unifi-endpoint-desktop-app-deb&filter=eq~~platform~~linux&filter=eq~~channel~~release"

# ── desktop (GNOME) ─────────────────────────────────────────────────
# `copyq menu` does not work on Wayland.
copyq_hotkey_enabled: true
copyq_hotkey_binding: "<Control><Alt>v"
copyq_hotkey_command: "copyq toggle"
copyq_hotkey_name: "CopyQ toggle"
copyq_autostart: true

# Extra shortcuts for the window manager's "Always on top" toggle; added to any
# already bound. [] leaves the setting alone.
wm_toggle_above_bindings: ["<Super><Control>t"]

# Put < > | on the key left of 1, for keyboards without the key left of Z.
xkb_lsgt_on_tlde: false

# User extensions from extensions.gnome.org (by UUID), enabled at next login.
gnome_extensions:
  - tilingshell@ferrarodomenico.com
# Disabled so they don't fight the above (Tiling Shell replaces Ubuntu's
# Tiling Assistant snapping).
gnome_extensions_disabled:
  - tiling-assistant@ubuntu.com

# ── touchpad ────────────────────────────────────────────────────────
# Forward the ASUS ProArt Studiobook touchpad's middle button, which the kernel
# drops. Skips itself on machines without that touchpad.
touchpad_middle_button_enabled: true

# ── ghostty ─────────────────────────────────────────────────────────
ghostty_config_enabled: true

# ── shell ───────────────────────────────────────────────────────────
oh_my_zsh_enabled: true
# fzf-tab must come after the completion plugins, zsh-syntax-highlighting last.
oh_my_zsh_plugins: [git, z, fzf, fzf-tab, zsh-autosuggestions, zsh-syntax-highlighting]
# Not bundled with oh-my-zsh: cloned into $ZSH_CUSTOM/plugins, pulled again
# with package_state=latest.
oh_my_zsh_custom_plugins:
  - { name: fzf-tab, repo: https://github.com/Aloxaf/fzf-tab }
  - { name: zsh-autosuggestions, repo: https://github.com/zsh-users/zsh-autosuggestions }
  - { name: zsh-syntax-highlighting, repo: https://github.com/zsh-users/zsh-syntax-highlighting }
zsh_set_default_shell: true

# Appears once "Enable SSH agent" is ticked in Bitwarden's settings.
bitwarden_ssh_agent_enabled: true
bitwarden_ssh_agent_sock: "$HOME/snap/bitwarden/current/.bitwarden-ssh-agent.sock"

# ── git ─────────────────────────────────────────────────────────────
# Commit/tag signing with SSH keys held in the Bitwarden agent: each commit
# is signed with the agent key whose comment is the repo's user.email, looked
# up at commit time (gpg.ssh.defaultKeyCommand), so no key is stored.
git_signing_enabled: true
# Not stored in the repo: taken from $GIT_SIGNING_EMAIL, else git's
# user.email. No agent key for it => signing skipped.
git_signing_email: "{{ lookup('env', 'GIT_SIGNING_EMAIL') }}"
git_config_dir: "{{ target_home }}/.config/git"
git_allowed_signers_file: "{{ git_config_dir }}/allowed_signers"
git_signing_key_command: "{{ git_config_dir }}/signing-key"

# Per-remote identity via includeIf "hasconfig:remote.*.url:...": a repo whose
# remote is git@<host>:... gets that profile's user.email and the agent key
# whose comment matches it. Other repos keep the global user.email.
# Not stored in the repo: host/owner/email come from $GIT_<NAME>_HOST /
# $GIT_<NAME>_OWNER / $GIT_<NAME>_EMAIL, else from the files a previous run
# wrote. A profile missing host or email is skipped. host is the forge itself,
# or an SSH Host alias for a second account on it (hostname). owner, if set,
# narrows the profile to git@<host>:<owner>/... (a user or org) and wins over
# a profile for the whole host, so no alias is needed.
git_profiles_enabled: true
git_profiles:
  - name: personal
    host: "{{ lookup('env', 'GIT_PERSONAL_HOST', default='github.com') }}"
    owner: "{{ lookup('env', 'GIT_PERSONAL_OWNER') }}"
    hostname: github.com
    email: "{{ lookup('env', 'GIT_PERSONAL_EMAIL') }}"
  - name: work
    host: "{{ lookup('env', 'GIT_WORK_HOST') }}"
    owner: "{{ lookup('env', 'GIT_WORK_OWNER') }}"
    hostname: github.com
    email: "{{ lookup('env', 'GIT_WORK_EMAIL') }}"
git_profiles_file: "{{ git_config_dir }}/profiles.gitconfig"
# A Host block per profile in ~/.ssh/config that offers only its Bitwarden key.
# The public halves are written from the agent; no key files are kept by hand.
git_profiles_ssh: true
git_ssh_key_dir: "{{ target_home }}/.ssh/bitwarden"

# delta as git's pager, and as lazygit's diff viewer. Skipped until delta is
# installed (packages role), since git errors out on a missing pager.
git_delta_enabled: true

# ── docker ──────────────────────────────────────────────────────────
docker_enabled: true
# Effectively root on this machine.
docker_users: ["{{ target_user }}"]

# ── node ────────────────────────────────────────────────────────────
nvm_enabled: true
nvm_version: v0.40.1
nvm_node_version: "--lts"     # "node" for newest Current
nvm_default_alias: "lts/*"

# ── homebrew ────────────────────────────────────────────────────────
homebrew_enabled: true
homebrew_prefix: /home/linuxbrew/.linuxbrew
homebrew_packages:
  - opencode

# ── TPM / LUKS auto-unlock (playbooks/tpm-unlock.yml) ───────────────
tpm_pcrs: "7"          # e.g. "0,7"
tpm_device: ""         # empty => auto-detect the LUKS volume behind /
tpm_rebind: false      # true => drop the existing TPM slot and re-seal

# ── VMware Workstation (playbooks/vmware.yml) ───────────────────────
vmware_vm_dir: ""                             # VM folder for the perms fix
vmware_tmp_dir: "{{ target_home }}/vmware-tmp"  # off the RAM-backed /tmp
vmware_mok_dir: /var/lib/shim-signed/mok
vmware_config: /etc/vmware/config
# Check with `xprop WM_CLASS`.
vmware_grab_wm_classes: [vmware, Vmware]
# Xwayland scale; 0 is GNOME's automatic default. 1 stops a VMware window on a
# 1x monitor being drawn at 2x (the highest monitor scale) and shrunk.
vmware_xwayland_scaling_factor: 1

# ── secrets: API keys from Vaultwarden via rbw ──────────────────────
# Ansible never sees a key; sync-secrets fetches them into tmpfs at runtime.
rbw_enabled: true
# Not stored in the repo: bootstrap.sh takes them from $RBW_BASE_URL/$RBW_EMAIL,
# else ~/.config/rbw/config.json, else a one-time prompt. Empty => role skipped.
rbw_base_url: "{{ lookup('env', 'RBW_BASE_URL') }}"
rbw_email: "{{ lookup('env', 'RBW_EMAIL') }}"
rbw_folder: Work                             # default for opencode_secrets
rbw_pinentry: pinentry-gnome3                # pinentry-curses when headless
rbw_lock_timeout: 28800
rbw_sync_interval: 3600                      # 0 disables
rbw_sync_on_login: false

# tmpfs, so plaintext keys never reach disk.
opencode_secrets_dir: "/run/user/{{ ansible_facts.user_uid }}/opencode"

# folder is case-sensitive; field defaults to the password.
# Check names with: rbw list --fields name,folder
opencode_secrets:
  - { dest: openrouter.work.key, folder: Work, item: openrouter.ai, field: apikey }
  - { dest: openrouter.personal.key, folder: Personal, item: openrouter.ai, field: apikey }
  - { dest: jira.work.user, folder: Work, item: id.atlassian.com, field: username }
  - { dest: jira.work.key, folder: Work, item: id.atlassian.com, field: apikey }
  # Site URL (https://<tenant>.atlassian.net) lives in the vault, not the repo.
  - { dest: jira.work.url, folder: Work, item: id.atlassian.com, field: url }
